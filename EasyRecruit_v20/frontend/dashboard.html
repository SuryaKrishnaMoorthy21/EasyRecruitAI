<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard — EasyRecruit ATS 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#0d0f14;--ink2:#1c2030;--slate:#3c4560;--muted:#7a849e;
  --border:#e4e8f0;--surface:#f6f8fc;--white:#ffffff;
  --accent:#4361ee;--accent2:#7b2ff7;--green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --grad:linear-gradient(135deg,#4361ee 0%,#7b2ff7 100%);
  --radius:12px;--radius-lg:20px;
  --shadow:0 2px 12px rgba(13,15,20,.08);--shadow-lg:0 12px 40px rgba(67,97,238,.18);
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--t:.2s ease;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--surface);color:var(--ink);min-height:100vh;}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 32px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-brand .icon{
  width:36px;height:36px;background:var(--grad);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;
}
.topbar-brand .name{font-family:var(--font-head);font-weight:700;font-size:1.1rem;color:var(--ink);}
.topbar-brand .ver{
  font-size:.72rem;font-weight:600;background:linear-gradient(135deg,#eef0ff,#f3e8ff);
  color:var(--accent);padding:2px 8px;border-radius:100px;
}
.nav-item{
  padding:8px 16px;border-radius:8px;font-size:.88rem;font-weight:600;
  color:var(--muted);cursor:pointer;transition:var(--t);border:none;background:none;
  font-family:var(--font-body);
}
.nav-item:hover,.nav-item.active{background:var(--surface);color:var(--accent);}
.user-avatar{
  width:36px;height:36px;border-radius:50%;background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:.9rem;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 28px;border:none;border-radius:var(--radius);
  font-family:var(--font-body);font-size:.95rem;font-weight:600;cursor:pointer;transition:var(--t);
}
.btn-ghost{background:transparent;color:var(--slate);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--surface);}
.btn-primary{background:var(--grad);color:#fff;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}

.main-content{max-width:1200px;margin:0 auto;padding:36px 32px;}
.page-title{font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:var(--ink);margin-bottom:6px;}
.page-sub{color:var(--muted);margin-bottom:32px;font-size:.95rem;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:36px;}
.stat-card{
  background:var(--white);border-radius:var(--radius-lg);padding:24px;
  border:1px solid var(--border);display:flex;align-items:center;gap:16px;
  transition:var(--t);
}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.stat-icon.blue{background:#eef2ff;}.stat-icon.green{background:#ecfdf5;}
.stat-icon.amber{background:#fffbeb;}.stat-icon.purple{background:#f5f3ff;}
.stat-value{font-family:var(--font-head);font-size:1.8rem;font-weight:800;color:var(--ink);line-height:1;margin-bottom:4px;}
.stat-label{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px;}
.card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.card-header{
  padding:20px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-title{font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--ink);}
.card-body{padding:24px;}

.history-table{width:100%;border-collapse:collapse;}
.history-table th{
  text-align:left;font-size:.78rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;padding:12px 20px;
  border-bottom:2px solid var(--border);
}
.history-table td{
  padding:14px 20px;font-size:.88rem;border-bottom:1px solid var(--border);color:var(--slate);
}
.history-table tr:last-child td{border-bottom:none;}
.history-table tr:hover td{background:var(--surface);}
.score-badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:.78rem;font-weight:700;}
.score-badge.high{background:#ecfdf5;color:#065f46;}
.score-badge.medium{background:#fffbeb;color:#78350f;}
.score-badge.low{background:#fef2f2;color:#7f1d1d;}

.empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
.empty-state .icon{font-size:3rem;margin-bottom:12px;}

#historyWrap{overflow-x:auto;}

@media(max-width:900px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .charts-grid{grid-template-columns:1fr;}
}
@media(max-width:768px){
  .topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 16px;gap:8px;}
  .topbar-brand{order:1;}
  .topbar>div:nth-child(2){order:3;width:100%;justify-content:center;}
  .topbar>div:last-child{order:2;margin-left:auto;}
  .history-table{min-width:640px;}
}
@media(max-width:600px){
  .stats-row{grid-template-columns:1fr;}
  .main-content{padding:20px 16px;}
  .topbar{padding:10px 14px;}
  .page-title{font-size:1.3rem;}
  #userNameTop{display:none;}
}
</style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-brand">
    <div class="icon">📋</div>
    <span class="name">EasyRecruit</span>
    <span class="ver">v3.0</span>
  </div>
  <div style="display:flex;align-items:center;gap:4px">
    <button class="nav-item" onclick="location.href='/'">Analyze</button>
    <button class="nav-item active">Dashboard</button>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="user-avatar" id="userInitial">U</div>
    <span style="font-size:.88rem;font-weight:600;color:var(--ink)" id="userNameTop">User</span>
    <button class="btn btn-ghost" style="padding:7px 16px;font-size:.82rem" onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="main-content">
  <h1 class="page-title">Analytics Dashboard</h1>
  <p class="page-sub">Overview of all resume analyses and candidate statistics.</p>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon blue">📊</div>
      <div><div class="stat-value" id="statTotal">—</div><div class="stat-label">Total Analyses</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">⭐</div>
      <div><div class="stat-value" id="statAvg">—</div><div class="stat-label">Avg Score</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">🔥</div>
      <div><div class="stat-value" id="statHigh">—</div><div class="stat-label">Highest</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon purple">📅</div>
      <div><div class="stat-value" id="statRecent">—</div><div class="stat-label">Last 7 Days</div></div>
    </div>
  </div>

  <div class="charts-grid">
    <div class="card">
      <div class="card-header"><span class="card-title">Score Distribution</span></div>
      <div class="card-body"><canvas id="scoreDistChart" height="240"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Score Trend (Last 10)</span></div>
      <div class="card-body"><canvas id="scoreTrendChart" height="240"></canvas></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Recent Analyses</span>
      <button class="btn btn-ghost" style="padding:7px 16px;font-size:.82rem" onclick="loadAll()">↻ Refresh</button>
    </div>
    <div id="historyWrap">
      <div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div>
    </div>
  </div>
</div>

<script>
const API = (location.protocol === 'file:') ? 'http://localhost:8001' : (location.origin);
const token = localStorage.getItem('er_token');
const user  = JSON.parse(localStorage.getItem('er_user') || 'null');

if (!token) { location.href = '/'; }

// Init user display
if (user) {
  const name = user.full_name || user.username || 'User';
  document.getElementById('userNameTop').textContent = name;
  document.getElementById('userInitial').textContent = name.charAt(0).toUpperCase();
}

async function apiFetch(path) {
  const res = await fetch(API + path, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  return res.json().catch(() => ({}));
}

function logout() {
  fetch(API + '/api/v1/auth/logout', { method:'POST', headers:{'Authorization':'Bearer '+token} })
    .catch(()=>{});
  localStorage.clear();
  location.href = '/';
}

async function loadAll() {
  const [stats, history] = await Promise.all([
    apiFetch('/api/v1/analysis/stats/summary'),
    apiFetch('/api/v1/analysis/?page=1&per_page=20'),
  ]);

  // Stat cards
  document.getElementById('statTotal').textContent  = stats.total_analyses ?? '—';
  document.getElementById('statAvg').textContent    = stats.average_score  ? stats.average_score + '%' : '—';
  document.getElementById('statHigh').textContent   = stats.highest_score  ? stats.highest_score + '%' : '—';
  document.getElementById('statRecent').textContent = stats.recent_activity_7_days ?? '—';

  // Distribution chart
  const dist = stats.score_distribution || {};
  renderDistChart(dist);

  // Trend chart
  const items = history.items || [];
  renderTrendChart(items);

  // Table
  renderTable(items);
}

function renderDistChart(dist) {
  const ctx = document.getElementById('scoreDistChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(dist),
      datasets: [{
        label: 'Resumes',
        data:  Object.values(dist),
        backgroundColor: ['#fecaca','#fde68a','#a7f3d0','#bfdbfe','#c4b5fd'],
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: '#f1f5f9' } },
        x: { grid: { display: false } }
      }
    }
  });
}

function renderTrendChart(items) {
  const last10 = items.slice(0, 10).reverse();
  const ctx = document.getElementById('scoreTrendChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: last10.map((_, i) => `#${i+1}`),
      datasets: [{
        label: 'Overall Score',
        data:  last10.map(r => Math.round(r.overall_score || 0)),
        borderColor: '#4361ee',
        backgroundColor: 'rgba(67,97,238,.08)',
        borderWidth: 2.5,
        pointBackgroundColor: '#4361ee',
        pointRadius: 5,
        fill: true,
        tension: 0.35,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: false, min: 0, max: 100, grid: { color: '#f1f5f9' } },
        x: { grid: { display: false } }
      }
    }
  });
}

// API data is untrusted (resume-derived names/filenames): escape before putting it in HTML.
function escH(s) {
  return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderTable(items) {
  const wrap = document.getElementById('historyWrap');
  if (!items.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No analyses saved yet.</p></div>';
    return;
  }
  wrap.innerHTML = `
    <table class="history-table">
      <thead>
        <tr>
          <th>Filename</th><th>Candidate</th>
          <th>Overall</th><th>Keywords</th><th>Skills</th>
          <th>Structure</th><th>Date</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(r => {
          const s = Math.round(r.overall_score || 0);
          const cls = s >= 75 ? 'high' : s >= 50 ? 'medium' : 'low';
          return `<tr>
            <td>${escH(r.filename || '—')}</td>
            <td>${escH(r.candidate_name || '—')}</td>
            <td><span class="score-badge ${cls}">${s}%</span></td>
            <td>${Math.round(r.keyword_score || 0)}%</td>
            <td>${Math.round(r.skill_score || 0)}%</td>
            <td>${Math.round(r.structure_score || 0)}%</td>
            <td>${r.created_at ? new Date(r.created_at).toLocaleDateString() : '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

loadAll();
</script>
</body>
</html>
